# Builds the Smart Colliders native plugin with CoACD for Windows x64 and macOS universal.
# Artifacts replace Packages/com.reclabs.smart.colliders/Plugins/* (commit them manually after review).
name: native-plugins
on:
  workflow_dispatch:
  push:
    paths: [ "Packages/com.reclabs.smart.colliders/Native~/**" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            configure: cmake -S . -B build -A x64 -DSC_WITH_COACD=ON
            artifact: build/Release/smartcolliders_native.dll
          - os: macos-latest
            configure: cmake -S . -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DSC_WITH_COACD=ON
            artifact: build/Release/smartcolliders_native.dylib
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Packages/com.reclabs.smart.colliders/Native~
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: ${{ matrix.configure }}
      - name: Build
        run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: smartcolliders_native-${{ matrix.os }}
          path: Packages/com.reclabs.smart.colliders/Native~/${{ matrix.artifact }}
